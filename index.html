<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Uber catering</h1>
        <nav>
            <div class="pastries nav">Pastries</div>
            <div class="cookies nav">Biscuits</div>
            <div class="drinks nav">Beverages</div>
        </nav>
    </header>
    <main>
        <section class="hero">
            <div class="pastries hero"></div>
            <div class="cookies hero"></div>
            <div class="drinks hero"></div>
        </section>
        <section class="pastries">Pastries
            <div class="pastries container"></div>
        </section>
        <section class="cookies">Biscuits
            <div class="cookies container"></div>
        </section>
         <section class="drinks">Beverages
            <div class="drinks container"></div>
        </section>
        <section class="contact">
            <div class="contact info"></div>
            <form id="contact-form">
                <input type="email" name="email" placeholder="ex:mymail@example.com">
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <footer>
        Michael Wolde ~ 2026
    </footer>
    
</body>
</html>
